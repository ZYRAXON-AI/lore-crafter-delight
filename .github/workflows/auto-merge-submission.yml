name: Auto-merge library submissions

# A submission pull request only adds a folder under pdf-library/ (the older
# books-submission/ path is still accepted). Every changed file must sit inside
# one of those folders and at least one book file or manuscript must be present;
# then the PR is labelled and merged automatically, so merged books appear on the
# site immediately with no rebuild.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the pull request only touches a library folder
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          if [ -z "$changed" ] || echo "$changed" | grep -qvE '^(pdf-library|books-submission)/'; then
            echo "in_scope=false" >> "$GITHUB_OUTPUT"
          else
            echo "in_scope=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate each submission folder
        if: steps.scope.outputs.in_scope == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          # meta.json is mandatory: every submission folder must carry one, and
          # it must be valid JSON with a non-empty title. A manuscript file is
          # also required. Optional metadata fields (author, genre, description)
          # are derived by the site when absent.
          dirs=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -E '^(pdf-library|books-submission)/[^/]+/' \
            | sed -E 's#^((pdf-library|books-submission)/[^/]+)/.*#\1#' | sort -u)
          for dir in $dirs; do
            if [ ! -d "$dir" ]; then continue; fi
            if [ -n "$(find "$dir" -maxdepth 1 -type f \( -name '*.txt' -o -name '*.md' -o -name '*.pdf' -o -name '*.epub' \) -print -quit)" ]; then
              echo "Found a book file in $dir"
            else
              echo "No book file (.txt/.md/.pdf/.epub) in $dir"
              fail=1
            fi
            if [ -n "$(find "$dir" -maxdepth 1 -type f \( -iname 'cover.*' -o -iname 'icon.*' \) -print -quit)" ]; then
              echo "Found a cover image in $dir"
            elif node -e "const fs=require('fs');for(const n of ['meta.json','metadata.json','book.json']){try{const m=JSON.parse(fs.readFileSync(process.argv[1]+'/'+n,'utf8'));if(String(m.cover_url||m.cover||'').trim())process.exit(0)}catch{}}process.exit(1)" "$dir"; then
              echo "Found a cover_url in $dir metadata"
            else
              echo "No cover image (cover.*/icon.*) or cover_url in $dir"
              fail=1
            fi
            found_meta=""
            for meta in "$dir"/meta.json "$dir"/metadata.json "$dir"/book.json; do
              [ -f "$meta" ] || continue
              found_meta="$meta"
              if ! node -e "const m=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if(!m.title||!String(m.title).trim()) process.exit(2)" "$meta"; then
                echo "Invalid or untitled metadata: $meta"
                fail=1
              fi
            done
            if [ -z "$found_meta" ]; then
              echo "Missing meta.json (mandatory) in $dir"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Label and merge
        if: steps.scope.outputs.in_scope == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create submission --color 0e8a16 --description "Community library submission" || true
          gh pr edit "$PR" --add-label "submission" || true
          gh pr merge "$PR" --squash --delete-branch
